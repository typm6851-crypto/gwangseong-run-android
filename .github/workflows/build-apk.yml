name: 광성런 APK 만들기

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 파일 준비
        uses: actions/checkout@v4

      - name: 자바 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 설치
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: APK 제작
        run: gradle assembleDebug

      - name: APK 저장
        uses: actions/upload-artifact@v4
        with:
          name: 광성런-설치파일
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: 설치 QR용 최신 버전 공개
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${GITHUB_RUN_NUMBER}" app/build/outputs/apk/debug/app-debug.apk --title "광성런 최신 앱" --notes "회원가입, 로그인, 비밀번호 재설정 기능 포함" --latest
